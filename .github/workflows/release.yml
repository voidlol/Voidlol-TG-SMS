name: Build Release APK + Publish Update Metadata

on:
  push:
    branches: [master]
    paths-ignore:
      - version.properties

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.bump_version.outputs.version_name }}
      version_code: ${{ steps.bump_version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      apk_name: ${{ steps.apk.outputs.apk_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump app version
        id: bump_version
        run: |
          source version.properties
          VERSION_PATCH=$((VERSION_PATCH + 1))
          {
            echo "VERSION_MAJOR=$VERSION_MAJOR"
            echo "VERSION_MINOR=$VERSION_MINOR"
            echo "VERSION_PATCH=$VERSION_PATCH"
          } > version.properties

          VERSION_NAME="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          VERSION_CODE=$((VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Generate version tag
        id: version
        run: |
          VERSION_NAME="${{ steps.bump_version.outputs.version_name }}"
          VERSION_CODE="${{ steps.bump_version.outputs.version_code }}"
          TAG="v${VERSION_NAME}-${VERSION_CODE}-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APK_NAME="VoidlolTGSMS-${{ steps.version.outputs.version_name }}.apk"
          mv "$APK" "app/build/outputs/apk/release/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            Automated release from `master` branch.

            **Commit:** ${{ github.sha }}
          files: app/build/outputs/apk/release/VoidlolTGSMS-${{ steps.version.outputs.version_name }}.apk
          generate_release_notes: true

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "ci: bump version to ${{ steps.bump_version.outputs.version_name }} [skip ci]" || exit 0
          git push

  publish-update-json:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate update.json
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          TAG: ${{ needs.build.outputs.tag }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p site

          APK_URL="https://github.com/${REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > site/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "changelog": "See GitHub release notes",
            "publishedAt": "${PUBLISHED_AT}"
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
